<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>BTC · OTT Bot Cup</title>
  <link rel="icon" href="/uet-logo.webp" type="image/webp">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <a class="skip" href="#view">Bỏ qua tới nội dung</a>
  <header class="top">
    <button id="menu-toggle" class="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false">Menu</button>
    <div class="brand">
      <img src="/uet-logo.webp" alt="Logo Trường Đại học Công nghệ, ĐHQGHN" width="44" height="44">
      <div class="brand-text">
        <span class="eyebrow">Trường ĐH Công nghệ · ĐHQGHN</span>
        <h1>OTT Bot Cup · Ban tổ chức</h1>
      </div>
    </div>
    <div id="event-chips" class="chips" aria-live="polite"></div>
    <div class="account">
      <span id="who"></span>
      <button id="logout" class="on-blue" type="button" hidden>Đăng xuất</button>
    </div>
  </header>

  <main id="login" class="login" hidden aria-labelledby="login-title">
    <div class="login-card">
      <img src="/uet-logo.webp" alt="" width="72" height="72">
      <h2 id="login-title">Đăng nhập Ban tổ chức</h2>
      <p class="muted">Chỉ tài khoản có trong danh sách BTC. Mọi thao tác ghi đều vào audit log.</p>
      <form id="login-form">
        <label>Email <input name="email" type="email" autocomplete="username" required></label>
        <label>Mật khẩu <input name="password" type="password" autocomplete="current-password" required></label>
        <label>Mã TOTP (6 số) <input name="totp" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" required></label>
        <button type="submit">Đăng nhập</button>
      </form>
      <p id="login-status" class="status" role="status"></p>
    </div>
  </main>

  <div id="app" class="shell" hidden>
    <nav id="sidebar" class="sidebar" aria-label="Mục quản trị">
      <p class="nav-group">Giải đấu</p>
      <button type="button" data-tab="overview">Tổng quan</button>
      <button type="button" data-tab="tournament">Điều phối giải</button>
      <button type="button" data-tab="matches">Trận</button>
      <p class="nav-group">Đội &amp; bài</p>
      <button type="button" data-tab="teams">Đội</button>
      <button type="button" data-tab="submissions">Bài nộp</button>
      <p class="nav-group">Giám sát</p>
      <button type="button" data-tab="flags">Cờ gian lận <span class="count" data-count="openFlags"></span></button>
      <button type="button" data-tab="runners">Runner &amp; job <span class="count" data-count="failedJobs"></span></button>
      <p class="nav-group">Quản trị</p>
      <button type="button" data-tab="pending">Chờ duyệt <span class="count" data-count="pendingApprovals"></span></button>
      <button type="button" data-tab="announcements">Thông báo</button>
      <button type="button" data-tab="audit">Audit log</button>
    </nav>
    <div class="content">
      <div id="status" role="status" class="status"></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <script src="/admin.js" type="module"></script>
</body>
</html>
